<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <radialGradient id="goldRadial" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#EAB308" />
      <stop offset="80%" stop-color="#A16207" />
      <stop offset="100%" stop-color="#713F12" />
    </radialGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#shieldBg)" stroke="url(#goldLinear)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="url(#goldLinear)" stroke-width="0.75" stroke-dasharray="2 1.5"/>

  <!-- Crossed Swords Behind Shield -->
  <!-- Sword 1: Top-Left to Bottom-Right -->
  <path d="M14 14 L48 48" stroke="url(#bladeGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 12 L17 17" stroke="url(#goldLinear)" stroke-width="3" stroke-linecap="round"/>
  <path d="M13 18 L18 13" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="11" cy="11" r="1.5" fill="url(#goldLinear)"/>

  <!-- Sword 2: Top-Right to Bottom-Left -->
  <path d="M50 14 L16 48" stroke="url(#bladeGrad)" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 12 L47 17" stroke="url(#goldLinear)" stroke-width="3" stroke-linecap="round"/>
  <path d="M51 18 L46 13" stroke="url(#goldLinear)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="53" cy="11" r="1.5" fill="url(#goldLinear)"/>

  <!-- Central Shield Crest -->
  <path d="M32 16 C38 16 44 19 44 26 C44 38 34 46 32 48 C30 46 20 38 20 26 C20 19 26 16 32 16 Z" 
        fill="#0f172a" stroke="url(#goldLinear)" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Shield Internal Tricolor Accent (Egyptian flag subtle accents) -->
  <path d="M22 26 C22 22 26 19 32 19 C38 19 42 22 42 26 L22 26 Z" fill="#991b1b" opacity="0.9"/>
  <path d="M21.2 26 L42.8 26 L43.5 32 L20.5 32 Z" fill="#f8fafc" opacity="0.95"/>
  <path d="M20.5 32 L43.5 32 C42 39 34 45 32 46.5 C30 45 22 39 20.5 32 Z" fill="#020617"/>

  <!-- Golden Eagle of Saladin (Silhouette / Iconographic form) -->
  <g transform="translate(32, 31) scale(0.65)" filter="url(#glow)">
    <!-- Eagle Body & Wings -->
    <path d="M0 -15 C2 -15 3 -13 3 -10 C6 -12 12 -12 15 -7 C17 -4 16 3 13 8 C11 5 9 3 7 3 C6 7 4 10 0 12 C-4 10 -6 7 -7 3 C-9 3 -11 5 -13 8 C-16 3 -17 -4 -15 -7 C-12 -12 -6 -12 -3 -10 C-3 -13 -2 -15 0 -15 Z" 
          fill="url(#goldRadial)" stroke="#713F12" stroke-width="0.5"/>
    <!-- Eagle Head Profile -->
    <path d="M0 -14 C1 -16 3 -17 5 -17 C6 -17 7 -16 6 -15 C8 -15 9 -14 7 -13 C5 -13 3 -13 1 -13 Z" fill="url(#goldRadial)"/>
    <!-- Eagle Chest Shield -->
    <path d="M-3.5 -5 L3.5 -5 C4 0 3 4 0 6 C-3 4 -4 0 -3.5 -5 Z" fill="#713F12" stroke="url(#goldLinear)" stroke-width="0.6"/>
  </g>

  <!-- Laurel Wreath (Leaves framing bottom sides) -->
  <!-- Left Wreath -->
  <path d="M17 38 C15 35 15 30 17 26 M16 33 C13 32 12 34 14 36 M17 28 C14 28 14 30 16 31" 
        stroke="url(#goldLinear)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <!-- Right Wreath -->
  <path d="M47 38 C49 35 49 30 47 26 M48 33 C51 32 52 34 50 36 M47 28 C50 28 50 30 48 31" 
        stroke="url(#goldLinear)" stroke-width="1.4" stroke-linecap="round" fill="none"/>

  <!-- Lower Motto Banner Ribbon -->
  <path d="M16 49 Q32 55 48 49 L46 53 Q32 58 18 53 Z" fill="url(#goldRadial)" stroke="#854d0e" stroke-width="0.5"/>
  <circle cx="32" cy="54" r="1.2" fill="#fff"/>
  <circle cx="26" cy="53" r="0.9" fill="#fff"/>
  <circle cx="38" cy="53" r="0.9" fill="#fff"/>

  <!-- Top Star -->
  <path d="M32 9.5 L33 12 L35.5 12 L33.5 13.5 L34.2 16 L32 14.5 L29.8 16 L30.5 13.5 L28.5 12 L31 12 Z" 
        fill="url(#goldLinear)" stroke="#854d0e" stroke-width="0.3"/>
</svg>
